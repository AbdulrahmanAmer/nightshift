name: ci

# Owner: C10 (docs/ENGINEERING.md section 7). Required status checks on main: lint, types, test, ui-build, powershell-parse, scope-check.
on:
  push:
  pull_request:
  # A daily run of the test job on main: the online pin checks (manifest URLs, hashes) must run for real here,
  # an upstream outage fails them instead of skipping them (NS_REQUIRE_ONLINE below). Tag pushes do the same.
  schedule:
    - cron: "23 4 * * *"

# One run per branch and event type; a newer push cancels the older run of the same kind.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .

  types:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pyright

  test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # Turns on the tests marked `network` (tests/test_downloader_network.py): real downloads from GitHub and
      # Hugging Face to prove pause/resume/Range/SHA256 against the real servers. Unset on a laptop = skipped.
      NS_NETWORK_TESTS: "1"
      # Where an online check may not be skipped for an upstream outage (the nightly run and every tag push):
      # an outage that outlasts the retries in tests/online.py then fails the test instead of skipping it. On a
      # push or a pull request it is empty, an outage skips the online pin checks and the step below says so.
      NS_REQUIRE_ONLINE: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && '1' || '' }}
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -e ".[dev]"
      # The real-network resume tests run on their own so their evidence (bytes before the pause, the Range
      # header, the final hash) is printed in the log. They must run: a skip fails the step, with ONE exception:
      # a test skipped as "upstream outage: <host> <status>" (the host kept answering 5xx through every retry in
      # tests/online.py). A GitHub incident can last hours, so on a push or pull request that is a visible
      # warning and the step passes; on the nightly run and tag pushes (NS_REQUIRE_ONLINE=1) the test fails.
      # A 4xx, a wrong size or a wrong hash fails on every kind of run.
      - name: Real-network download tests
        shell: bash
        timeout-minutes: 12
        run: |
          set +e
          timeout 300 python -m pytest -o addopts= -v -s -m network tests/test_downloader_network.py --junitxml=report-network.xml --tb=short -o faulthandler_timeout=120
          rc=$?
          set -e
          # An outage that outlasts the retries in tests/online.py skips a test with "upstream outage: <host> <status>"
          # (fails it where NS_REQUIRE_ONLINE is set); name it in the log so it is not read as a wrong pin.
          python dev/ci_outage_report.py report-network.xml || true
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("report-network.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          outage = 0
          for case in root.iter("testcase"):
              node = case.find("skipped")
              if node is not None and "upstream outage" in f"{node.get('message', '')} {node.text or ''}":
                  outage += 1
          print(f"network tests: {tests} ran, {skipped} skipped, {outage} of them for an upstream outage")
          assert tests >= 4, "the real-network tests must run in CI"
          assert skipped == outage, "the real-network tests must run in CI, not be skipped (except for an upstream outage)"
          EOF
      - name: Unit tests (everything but the real-network ones)
        if: always()
        run: python -m pytest -q -rs -m "not network" --junitxml=report.xml
      # The _online pin checks (tests/test_resolve_manifest.py) skip when a real host is in an outage that outlasts
      # three retries. Say how many did, as a warning; where NS_REQUIRE_ONLINE is set this step fails on any.
      - name: Online checks skipped for an upstream outage
        if: always()
        shell: bash
        run: python dev/ci_outage_report.py report.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: |
            report.xml
            report-network.xml
          if-no-files-found: ignore
          retention-days: 14

  # The dashboard front-end sources live in ns_dashboard/ui; the build output is committed in ns_dashboard/static
  # (the bundle is a git archive and the partner PC has no node). This job rebuilds it and fails on any difference.
  ui-build:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ns_dashboard/ui/package-lock.json
      - name: npm ci
        working-directory: ns_dashboard/ui
        run: npm ci --no-audit --no-fund
      - name: npm run build
        working-directory: ns_dashboard/ui
        run: npm run build
      - name: Committed build equals the sources
        shell: bash
        run: |
          changes="$(git status --porcelain ns_dashboard/static)"
          if [ -n "$changes" ]; then
            echo "::error::ns_dashboard/static differs from a fresh build of ns_dashboard/ui; run npm ci and npm run build in ns_dashboard/ui and commit the result"
            echo "$changes"
            exit 1
          fi
          changes="$(git status --porcelain installer/ui/static)"
          if [ -n "$changes" ]; then
            echo "::error::installer/ui/static differs from a fresh build of ns_dashboard/ui (npm run build also builds the installer UI); run npm ci and npm run build in ns_dashboard/ui and commit the result"
            echo "$changes"
            exit 1
          fi
      - name: Upload the CI build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-static-ci-build
          path: |
            ns_dashboard/static
            installer/ui/static
          if-no-files-found: ignore
          retention-days: 7

  powershell-parse:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Windows PowerShell 5.1 is the shell the scripts run in on the partner PC (INSTALL.cmd uses powershell.exe).
      - name: Parse every tracked .ps1, check every tracked .cmd
        shell: powershell
        run: |
          $failed = 0
          $files = @(git ls-files '*.ps1' '*.cmd')
          Write-Host "checking $($files.Count) script(s)"
          foreach ($f in $files) {
            $full = (Resolve-Path -LiteralPath $f).Path
            if ($f.EndsWith('.ps1')) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errors)
              foreach ($e in $errors) {
                $failed++
                Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            }
            else {
              # The PowerShell parser cannot read batch syntax: check the structural rules instead.
              $raw = [System.IO.File]::ReadAllText($full)
              if ($raw.Length -eq 0) { $failed++; Write-Host "::error file=$f::empty .cmd file" }
              if ($raw -match "(?<!\r)\n") { $failed++; Write-Host "::error file=$f::LF line ending, .cmd files must be CRLF" }
              if ($raw -match '[^\x00-\x7F]') { $failed++; Write-Host "::error file=$f::non-ASCII character" }
            }
          }
          if ($failed -gt 0) { throw "$failed script problem(s)" }
      - name: PSScriptAnalyzer (errors only)
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $bad = @()
          foreach ($f in @(git ls-files '*.ps1')) {
            $bad += @(Invoke-ScriptAnalyzer -Path $f -Severity Error)
          }
          if ($bad.Count -gt 0) { $bad | Format-List RuleName, ScriptName, Line, Message; throw "$($bad.Count) analyzer error(s)" }
      - name: installer/stage1.ps1 -AppPath $PWD.Path -DryRun
        shell: powershell
        run: |
          if (Test-Path installer/stage1.ps1) {
            $env:NIGHTSHIFT_HOME = Join-Path $env:RUNNER_TEMP 'ns-home'
            powershell -NoProfile -ExecutionPolicy Bypass -File installer/stage1.ps1 -AppPath $PWD.Path -DryRun
            if ($LASTEXITCODE -ne 0) { throw "stage1.ps1 -DryRun exited with $LASTEXITCODE" }
          }
          else {
            Write-Host 'installer/stage1.ps1 not present yet; skipped'
          }
      - name: make_bundle.ps1 -DryRun
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File dev/make_bundle.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw "make_bundle.ps1 -DryRun exited with $LASTEXITCODE" }

  # Builds the real zip with pwsh (the shell release.yml uses) so the release path is exercised on every push.
  bundle:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build bundle
        shell: pwsh
        run: ./dev/make_bundle.ps1
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: nightshift-bundle
          path: dist/*
          retention-days: 7

  scope-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the PR stays inside its component paths
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python dev/check_scope.py --base "origin/$env:BASE_REF" --branch "$env:HEAD_REF"
