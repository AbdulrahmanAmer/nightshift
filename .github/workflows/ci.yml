name: ci

# Owner: C10 (docs/ENGINEERING.md section 7). Required status checks on main: lint, types, test, ui-build, powershell-parse, scope-check.
# `test` is the job that gathers the test shards (test-shard (1/8) ... (8/8)); see the comment above it.
# A pull request that changes documents only (H-11, dev/ci_changes.py) runs the light path: the `changes` job decides,
# `test-docs` runs the tests that read documents, types and ui-build say "not applicable", the shards, test-collect
# and bundle do not run, and every required check still reports. Any doubt runs everything.
on:
  # A pull request branch is tested by its pull_request run alone: a push to it starts nothing a second time (H-3).
  # push runs for main (the merge result is tested again where it lands) and for tags (the release gate). A branch
  # that has no pull request has no CI at all until one is opened: open a draft pull request to run it.
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  # A daily run of the test job on main: the online pin checks (manifest URLs, hashes) must run for real here,
  # an upstream outage fails them instead of skipping them (NS_REQUIRE_ONLINE below). Tag pushes do the same.
  schedule:
    - cron: "23 4 * * *"

# A newer push to a pull request branch cancels the older run of that pull request (one group per branch). A push
# to main, a tag and the nightly run are NEVER cancelled (H-12: six main runs in a row were, so a green main could
# not be shown). Their group carries the ref AND the commit: a group keeps one running and one pending run and cancels
# an older pending one when a newer arrives even with cancel-in-progress false, so a shared group would still lose
# runs. The ref matters because a release tag points at the same commit as the main push (the push to main and the
# tag run must not queue behind each other) and an rc tag and the final tag can be on one commit too.
# The `ci-` prefix keeps these groups apart from release.yml's and build-qwentts.yml's (group names are repo-wide).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.head_ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # H-11: is this run a docs-only change? Only a pull request whose tested tree (github.sha, the merge commit)
  # differs from its base in documents alone is (docs/**, a top-level *.md, contracts/CHANGE_REQUESTS.md). Every
  # push, tag and nightly run, an empty or failed diff and a missing base say false: everything runs. The decide
  # step is the last step, so nothing can fail this job after the answer is written. If this job fails anyway, its
  # output is empty, every job below runs as for code, and the final `test` job fails on its result.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this a docs-only change? (dev/ci_changes.py decide)
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 dev/ci_changes.py decide --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --summary

  lint:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .

  # A required check. A skipped required job counts as passed, so on a docs-only change this job still runs: one
  # step on a small runner says pyright is not applicable (it reads the Python sources listed in pyproject.toml
  # [tool.pyright], none of which is a document). `!cancelled()` keeps it running in full if `changes` failed.
  types:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 10
    steps:
      - name: Docs-only change (pyright not applicable)
        if: needs.changes.outputs.docs_only == 'true'
        shell: bash
        run: |
          msg="docs-only change: not applicable. pyright reads the Python sources only; the changes job found documents only in this pull request (dev/ci_changes.py decide)."
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
        if: needs.changes.outputs.docs_only != 'true'
      - run: python -m pyright
        if: needs.changes.outputs.docs_only != 'true'

  # The unit tests run as a matrix of shards (H-3, H-3b): dev/ci_shards.py gives each shard whole test files, split
  # by measured seconds (dev/ci_shard_weights.json, refreshed from real JUnit timings), so each shard runs about 9.5
  # minutes of a suite of about 76 (SHARDS in dev/ci_shards.py is the count). The required check `test` further
  # down is the job that says whether all of them passed. On a docs-only change they do not run (`test` then
  # gathers `test-docs` instead).
  test-shard:
    name: test-shard (${{ matrix.shard }}/8)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    # Predicted: about 9.5 minutes of tests plus about 3 of setup (the slowest shard, dev/ci_shards.py plan), 12.5 in
    # all; tests/test_ci_workflow.py keeps the timeout at least twice the prediction of every shard, with room for
    # NEW_FILE_ROOM test files that have no measured weight yet (at 25 minutes one new test file turned every pull
    # request red, three times on 2026-11-09 and 2026-11-10).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Turns on the tests marked `network` (tests/test_downloader_network.py): real downloads from GitHub and
      # Hugging Face to prove pause/resume/Range/SHA256 against the real servers. Unset on a laptop = skipped.
      NS_NETWORK_TESTS: "1"
      # Where an online check may not be skipped for an upstream outage (the nightly run and every tag push):
      # an outage that outlasts the retries in tests/online.py then fails the test instead of skipping it. On a
      # push or a pull request it is empty, an outage skips the online pin checks and the step below says so.
      NS_REQUIRE_ONLINE: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && '1' || '' }}
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # FFmpeg is the build the product pins (manifest.json bins.ffmpeg), from the Actions cache or a verified
      # download. The step runs ffmpeg -version and ffprobe -version and fails by itself, naming the cause (an
      # upstream outage says so in the job summary), so a missing FFmpeg never reaches pytest (H-9).
      - name: Install FFmpeg (the pinned build)
        uses: ./.github/actions/install-ffmpeg
      - run: python -m pip install -e ".[dev]"
      # The real-network resume tests run on their own so their evidence (bytes before the pause, the Range
      # header, the final hash) is printed in the log. They run in shard 1 only. They must run: a skip fails the
      # step, with ONE exception: a test skipped as "upstream outage: <host> <status>" (the host kept answering
      # 5xx through every retry in tests/online.py). A GitHub incident can last hours, so on a push or pull
      # request that is a visible warning and the step passes; on the nightly run and tag pushes
      # (NS_REQUIRE_ONLINE=1) the test fails. A 4xx, a wrong size or a wrong hash fails on every kind of run.
      - name: Real-network download tests
        if: matrix.shard == 1
        shell: bash
        timeout-minutes: 12
        run: |
          set +e
          timeout 300 python -m pytest -o addopts= -v -s -m network tests/test_downloader_network.py --junitxml=report-network.xml --tb=short -o faulthandler_timeout=120
          rc=$?
          set -e
          # An outage that outlasts the retries in tests/online.py skips a test with "upstream outage: <host> <status>"
          # (fails it where NS_REQUIRE_ONLINE is set); name it in the log so it is not read as a wrong pin.
          python dev/ci_outage_report.py report-network.xml || true
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("report-network.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          outage = 0
          for case in root.iter("testcase"):
              node = case.find("skipped")
              if node is not None and "upstream outage" in f"{node.get('message', '')} {node.text or ''}":
                  outage += 1
          print(f"network tests: {tests} ran, {skipped} skipped, {outage} of them for an upstream outage")
          assert tests >= 4, "the real-network tests must run in CI"
          assert skipped == outage, "the real-network tests must run in CI, not be skipped (except for an upstream outage)"
          EOF
      - name: Unit tests (the files of this shard, everything but the real-network ones)
        if: ${{ !cancelled() }}
        shell: bash
        run: python dev/ci_shards.py run --shard ${{ matrix.shard }} --of 8 -- -q -rs -m "not network" --junitxml=report-shard-${{ matrix.shard }}.xml
      # The _online pin checks (tests/test_resolve_manifest.py) skip when a real host is in an outage that outlasts
      # three retries. Say how many did, as a warning; where NS_REQUIRE_ONLINE is set this step fails on any.
      # The final `test` job counts them again across all shards.
      - name: Online checks skipped for an upstream outage
        if: ${{ !cancelled() }}
        shell: bash
        run: python dev/ci_outage_report.py report-shard-${{ matrix.shard }}.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-shard-${{ matrix.shard }}
          path: |
            report-shard-${{ matrix.shard }}.xml
            report-network.xml
          if-no-files-found: ignore
          retention-days: 14

  # Collects every test once, unsharded, with the same environment as the shards. The final `test` job compares
  # this list, by node id, with what the shards were given and what they ran (dev/ci_shards.py verify).
  test-collect:
    name: test-collect
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NS_NETWORK_TESTS: "1"
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The same pinned FFmpeg as the shards: the collection must see the environment the shards run in.
      - name: Install FFmpeg (the pinned build)
        uses: ./.github/actions/install-ffmpeg
      - run: python -m pip install -e ".[dev]"
      - name: Collect every test, unsharded
        shell: bash
        run: |
          if ! python -m pytest --collect-only -q -o addopts= -m "not network" > collected.txt; then
            tail -n 80 collected.txt
            exit 1
          fi
          tail -n 2 collected.txt
      - name: Upload the collection
        uses: actions/upload-artifact@v4
        with:
          name: collected-tests
          path: collected.txt
          retention-days: 14

  # The docs-only path's tests (H-11): the test files that read documents (dev/ci_changes.py DOC_TESTS, one list;
  # tests/test_ci_changes.py fails when a test file that reads a document, itself or through the repository's own
  # imports, is missing from it). Not a required
  # check: the final `test` job needs it and passes on the docs path only when it passed. No FFmpeg is installed
  # here: the one FFmpeg render among those files (tests/test_captions.py, guarded by skipif) skips on this path
  # and is counted as skipped; the shards run it on every code change.
  test-docs:
    name: test-docs
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: The tests that read documents (dev/ci_changes.py run-doc-tests)
        shell: bash
        run: python dev/ci_changes.py run-doc-tests -- -q -rs -m "not network" --junitxml=report-docs.xml
      - name: Upload the report of the document tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-docs
          path: report-docs.xml
          if-no-files-found: ignore
          retention-days: 14

  # THE required check `test` (branch protection names it; the shards are test-shard (1/8) ... (8/8)). The job
  # runs whatever happened before it (`always()`): a skipped required check would count as passed. Its steps
  # run unless the run was cancelled (`!cancelled()`), so a superseded run costs one step, not a checkout, a
  # Python and the gate; the last step then fails the job, so a cancelled run never shows a green `test`. The
  # gate takes one of two paths (dev/ci_changes.py gate):
  # - code (every push, tag and nightly run, and every pull request that is not docs-only): it passes only when
  #   every shard and the collection job succeeded (a failed, skipped or cancelled shard fails it) AND the set of
  #   node ids the shards ran (from their JUnit reports) equals the set the unsharded collection found: no id
  #   missing, none twice, none extra. It also counts the upstream-outage skips over all shards and lists the
  #   twenty slowest tests;
  # - docs-only: it passes only when test-docs passed with at least one test run, and its summary says
  #   "docs-only change: N document tests ran, the code suite was not run".
  # Either way the decision job itself must have succeeded.
  test:
    needs: [changes, test-shard, test-collect, test-docs]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NS_REQUIRE_ONLINE: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
      - name: Download the report of the document tests
        if: ${{ !cancelled() && needs.changes.outputs.docs_only == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: junit-report-docs
          path: docs-report
      - name: The run's path and its jobs must have succeeded (dev/ci_changes.py gate)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOC_TESTS_RESULT: ${{ needs.test-docs.result }}
          SHARD_RESULT: ${{ needs.test-shard.result }}
          COLLECT_RESULT: ${{ needs.test-collect.result }}
        run: python dev/ci_changes.py gate --doc-report docs-report/report-docs.xml --summary
      - name: Download the JUnit reports of all shards
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: junit-report-shard-*
          path: reports
          merge-multiple: true
      - name: Download the unsharded collection
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: collected-tests
          path: collected
      - name: Predicted time per shard
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: python dev/ci_shards.py plan --of 8 --limit 720 --summary
      - name: The node ids the shards ran are exactly the node ids collected unsharded
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: python dev/ci_shards.py verify --of 8 --collected collected/collected.txt --reports reports --summary
      - name: Online checks skipped for an upstream outage (all shards)
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: python dev/ci_outage_report.py reports/*.xml
      - name: Twenty slowest tests
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: python dev/ci_slowest.py --top 20 --summary reports/*.xml
      # Last: a cancelled run (a newer push superseded it, or someone cancelled it) skipped every step above;
      # without this one the job would end green. It runs only then, and fails.
      - name: A cancelled run is not a result
        if: cancelled()
        shell: bash
        run: |
          echo "::error::this run was cancelled: the shards, the document tests and the gate did not all run"
          exit 1

  # The dashboard front-end sources live in ns_dashboard/ui; the build output is committed in ns_dashboard/static
  # (the bundle is a git archive and the partner PC has no node). This job rebuilds it and fails on any difference.
  # A required check: on a docs-only change it runs one step that says it is not applicable (the build reads
  # ns_dashboard/ui and installer/ui, and no document is under either), as `types` does.
  ui-build:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 10
    steps:
      - name: Docs-only change (the UI build not applicable)
        if: needs.changes.outputs.docs_only == 'true'
        shell: bash
        run: |
          msg="docs-only change: not applicable. The UI build reads ns_dashboard/ui and installer/ui only; the changes job found documents only in this pull request (dev/ci_changes.py decide)."
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ns_dashboard/ui/package-lock.json
      - name: npm ci
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ns_dashboard/ui
        run: npm ci --no-audit --no-fund
      - name: npm run build
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ns_dashboard/ui
        run: npm run build
      - name: Committed build equals the sources
        if: needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          changes="$(git status --porcelain ns_dashboard/static)"
          if [ -n "$changes" ]; then
            echo "::error::ns_dashboard/static differs from a fresh build of ns_dashboard/ui; run npm ci and npm run build in ns_dashboard/ui and commit the result"
            echo "$changes"
            exit 1
          fi
          changes="$(git status --porcelain installer/ui/static)"
          if [ -n "$changes" ]; then
            echo "::error::installer/ui/static differs from a fresh build of ns_dashboard/ui (npm run build also builds the installer UI); run npm ci and npm run build in ns_dashboard/ui and commit the result"
            echo "$changes"
            exit 1
          fi
      - name: Upload the CI build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-static-ci-build
          path: |
            ns_dashboard/static
            installer/ui/static
          if-no-files-found: ignore
          retention-days: 7

  powershell-parse:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Windows PowerShell 5.1 is the shell the scripts run in on the partner PC (INSTALL.cmd uses powershell.exe).
      - name: Parse every tracked .ps1, check every tracked .cmd
        shell: powershell
        run: |
          $failed = 0
          $files = @(git ls-files '*.ps1' '*.cmd')
          Write-Host "checking $($files.Count) script(s)"
          foreach ($f in $files) {
            $full = (Resolve-Path -LiteralPath $f).Path
            if ($f.EndsWith('.ps1')) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errors)
              foreach ($e in $errors) {
                $failed++
                Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            }
            else {
              # The PowerShell parser cannot read batch syntax: check the structural rules instead.
              $raw = [System.IO.File]::ReadAllText($full)
              if ($raw.Length -eq 0) { $failed++; Write-Host "::error file=$f::empty .cmd file" }
              if ($raw -match "(?<!\r)\n") { $failed++; Write-Host "::error file=$f::LF line ending, .cmd files must be CRLF" }
              if ($raw -match '[^\x00-\x7F]') { $failed++; Write-Host "::error file=$f::non-ASCII character" }
            }
          }
          if ($failed -gt 0) { throw "$failed script problem(s)" }
      - name: PSScriptAnalyzer (errors only)
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $bad = @()
          foreach ($f in @(git ls-files '*.ps1')) {
            $bad += @(Invoke-ScriptAnalyzer -Path $f -Severity Error)
          }
          if ($bad.Count -gt 0) { $bad | Format-List RuleName, ScriptName, Line, Message; throw "$($bad.Count) analyzer error(s)" }
      - name: installer/stage1.ps1 -AppPath $PWD.Path -DryRun
        shell: powershell
        run: |
          if (Test-Path installer/stage1.ps1) {
            $env:NIGHTSHIFT_HOME = Join-Path $env:RUNNER_TEMP 'ns-home'
            powershell -NoProfile -ExecutionPolicy Bypass -File installer/stage1.ps1 -AppPath $PWD.Path -DryRun
            if ($LASTEXITCODE -ne 0) { throw "stage1.ps1 -DryRun exited with $LASTEXITCODE" }
          }
          else {
            Write-Host 'installer/stage1.ps1 not present yet; skipped'
          }
      - name: make_bundle.ps1 -DryRun
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File dev/make_bundle.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw "make_bundle.ps1 -DryRun exited with $LASTEXITCODE" }

  # Builds the real zip with pwsh (the shell release.yml uses) so the release path is exercised on every push and
  # every pull request that changes code (not a required check; a docs-only change does not build it).
  bundle:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build bundle
        shell: pwsh
        run: ./dev/make_bundle.ps1
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: nightshift-bundle
          path: dist/*
          retention-days: 7

  scope-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the PR stays inside its component paths
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python dev/check_scope.py --base "origin/$env:BASE_REF" --branch "$env:HEAD_REF"
