name: release

# Owner: C10. Tags v* are created by the orchestrator on a green main commit (docs/ENGINEERING.md section 7).
# build-qwentts.yml also runs on v* tags and attaches Nightshift-VoiceEngine-win-cuda-x64.zip to the same release.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --junitxml=report.xml

  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag, VERSION and CHANGELOG agree
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $fileVersion = (Get-Content VERSION -Raw).Trim()
          if ($version -ne $fileVersion) { throw "tag $env:TAG does not match VERSION ($fileVersion)" }
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(?<body>.*?)(?=^## \[|\z)'
          $m = [regex]::Match($changelog, $pattern)
          if (-not $m.Success) { throw "CHANGELOG.md has no '## [$version]' heading; move the Unreleased entries under it before tagging" }
          # the release body: the "which file do I download" template, then this version's changelog entries
          $template = (Get-Content dev/release_notes.md -Raw).Replace('<ver>', $version)
          Set-Content -Path release-notes.md -Value ($template.TrimEnd() + "`n`n" + $m.Groups['body'].Value.Trim()) -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ns_dashboard/ui/package-lock.json

      - name: Build the dashboard UI and check the committed build
        shell: pwsh
        run: |
          Push-Location ns_dashboard/ui
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'npm run build failed' }
          Pop-Location
          # make_bundle.ps1 archives HEAD, so the committed ns_dashboard/static and installer/ui/static are what ships; it must equal this build.
          $changes = @(git status --porcelain ns_dashboard/static)
          if ($changes.Count -gt 0) { $changes; throw 'ns_dashboard/static differs from a fresh build of ns_dashboard/ui' }
          # the same build writes the installer's setup window to installer/ui/static (vite.installer.config.ts)
          $changes = @(git status --porcelain installer/ui/static)
          if ($changes.Count -gt 0) { $changes; throw 'installer/ui/static differs from a fresh build of ns_dashboard/ui' }

      - name: Fetch the WebView2 window files for the bundle
        shell: pwsh
        run: |
          # The frameless setup window needs three DLLs from the pinned nupkg. Shipping them inside the bundle
          # (bin/webview2/) lets the very first setup window use the host; s02 then skips the download.
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $pin = $manifest.bins.webview2
          $spec = Get-Content installer/webview2_files.json -Raw | ConvertFrom-Json
          if ($pin.sha256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'bins.webview2 is not pinned in manifest.json' }
          if ($spec.version -ne $pin.version) { throw "installer/webview2_files.json is for $($spec.version) but manifest.json pins $($pin.version)" }
          $nupkg = Join-Path $env:RUNNER_TEMP 'webview2.nupkg'
          Invoke-WebRequest -Uri $pin.url -OutFile $nupkg -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $nupkg -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $pin.sha256.ToLower()) { throw "webview2 nupkg sha256 $hash does not match the manifest pin $($pin.sha256)" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $out = Join-Path $env:RUNNER_TEMP 'webview2-bundle'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg)
          try {
            foreach ($prop in $spec.files.PSObject.Properties) {
              $entry = $zip.GetEntry($prop.Value.member)
              if ($null -eq $entry) { throw "the nupkg has no $($prop.Value.member)" }
              $dest = Join-Path $out $prop.Name
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
              $h = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLower()
              if ($h -ne $prop.Value.sha256.ToLower()) { throw "$($prop.Name) sha256 $h does not match installer/webview2_files.json" }
            }
          }
          finally { $zip.Dispose() }
          "WEBVIEW2_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build bundle
        shell: pwsh
        run: ./dev/make_bundle.ps1 -Version $env:TAG -WebView2Dir $env:WEBVIEW2_DIR

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $assets = @(
            "dist/Nightshift-Setup-$version.zip",
            "dist/Nightshift-Setup-$version.zip.sha256",
            "dist/Nightshift-Update-$version.zip",
            "dist/Nightshift-Update-$version.zip.sha256"
          )
          # build-qwentts.yml may have created the release already; create it only when absent.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "Nightshift $env:TAG" --notes-file release-notes.md --generate-notes
            if ($LASTEXITCODE -ne 0) {
              gh release view $env:TAG *> $null
              if ($LASTEXITCODE -ne 0) { throw 'could not create the release' }
            }
          }
          gh release upload $env:TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'asset upload failed' }
