name: release

# Owner: C10. Tags v* are created by the orchestrator on a green main commit (docs/ENGINEERING.md section 7).
# build-qwentts.yml also runs on v* tags and attaches Nightshift-VoiceEngine-win-cuda-x64.zip to the same release.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # The tag run is a FULL run of everything, as before, but the tests run as a matrix of shards (H-3); see the
  # same three jobs in ci.yml. No `-m` filter here: the network-marked tests are collected and (without
  # NS_NETWORK_TESTS) skipped exactly as they were in the single job; ci.yml's own tag run covers them.
  test-shard:
    name: test-shard (${{ matrix.shard }}/6)
    runs-on: windows-latest
    # About 8 minutes of tests plus about 3 of setup per shard (dev/ci_shards.py plan); the same timeout as ci.yml,
    # which tests/test_ci_workflow.py keeps at least twice the prediction of every shard. SHARDS in dev/ci_shards.py
    # is the count; tests/test_ci_workflow.py fails when this file and ci.yml disagree on it or on the proof.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The pinned FFmpeg (manifest.json bins.ffmpeg): see ci.yml and .github/actions/install-ffmpeg (H-9).
      - name: Install FFmpeg (the pinned build)
        uses: ./.github/actions/install-ffmpeg
      - run: python -m pip install -e ".[dev]"
      - name: Tests (the files of this shard)
        shell: bash
        run: python dev/ci_shards.py run --shard ${{ matrix.shard }} --of 6 -- -q --junitxml=report-shard-${{ matrix.shard }}.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-shard-${{ matrix.shard }}
          path: report-shard-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 14

  # Collects every test once, unsharded, in the same environment as the shards.
  test-collect:
    name: test-collect
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg (the pinned build)
        uses: ./.github/actions/install-ffmpeg
      - run: python -m pip install -e ".[dev]"
      - name: Collect every test, unsharded
        shell: bash
        run: |
          if ! python -m pytest --collect-only -q -o addopts= > collected.txt; then
            tail -n 80 collected.txt
            exit 1
          fi
          tail -n 2 collected.txt
      - name: Upload the collection
        uses: actions/upload-artifact@v4
        with:
          name: collected-tests
          path: collected.txt
          retention-days: 14

  # `release` needs this job. It passes only when every shard and the collection job succeeded AND the shards
  # together ran exactly the unsharded collection (no test in no shard, none in two); `always()` keeps it from
  # being skipped when a shard fails.
  test:
    needs: [test-shard, test-collect]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Every shard and the collection must have succeeded
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
          COLLECT_RESULT: ${{ needs.test-collect.result }}
        run: |
          echo "test-shard (all shards): $SHARD_RESULT"
          echo "test-collect: $COLLECT_RESULT"
          status=0
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::the test shards did not all succeed (result: $SHARD_RESULT); a failed, skipped or cancelled shard fails the release"
            status=1
          fi
          if [ "$COLLECT_RESULT" != "success" ]; then
            echo "::error::test-collect did not succeed (result: $COLLECT_RESULT)"
            status=1
          fi
          exit "$status"
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
      - name: Download the JUnit reports of all shards
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          pattern: junit-report-shard-*
          path: reports
          merge-multiple: true
      - name: Download the unsharded collection
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          name: collected-tests
          path: collected
      - name: The node ids the shards ran are exactly the node ids collected unsharded
        if: ${{ !cancelled() }}
        shell: bash
        run: python dev/ci_shards.py verify --of 6 --collected collected/collected.txt --reports reports --summary
      - name: Twenty slowest tests
        if: ${{ !cancelled() }}
        shell: bash
        run: python dev/ci_slowest.py --top 20 --summary reports/*.xml

  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag, VERSION and CHANGELOG agree
        shell: pwsh
        run: |
          # vX.Y.Z is a release. vX.Y.Z-rcN (N >= 1) is a release candidate: published as a prerelease, never "latest" (H-12).
          # Nothing else is a release tag (v0.1.15rc1, v0.1.15-rc, v0.1.15-beta1 fail here).
          $tm = [regex]::Match($env:TAG, '^v(?<base>\d+\.\d+\.\d+)(?<rc>-rc[1-9]\d*)?$')
          if (-not $tm.Success) { throw "'$env:TAG' is not a release tag: use vX.Y.Z, or vX.Y.Z-rcN for a release candidate" }
          $version = $env:TAG.Substring(1)
          $base = $tm.Groups['base'].Value
          $fileVersion = (Get-Content VERSION -Raw).Trim()
          if ($version -ne $fileVersion) { throw "tag $env:TAG does not match VERSION ($fileVersion)" }
          # A release needs the changelog heading '## [X.Y.Z]'. A candidate needs the heading of the final version it
          # previews, '## [X.Y.Z]', and also accepts its own exact '## [X.Y.Z-rcN]'.
          $changelog = Get-Content CHANGELOG.md -Raw
          $m = $null
          foreach ($heading in @($version, $base)) {
            $pattern = '(?ms)^## \[' + [regex]::Escape($heading) + '\][^\r\n]*\r?\n(?<body>.*?)(?=^## \[|\z)'
            $m = [regex]::Match($changelog, $pattern)
            if ($m.Success -or -not $tm.Groups['rc'].Success) { break }
          }
          if (-not $m.Success) { throw "CHANGELOG.md has no '## [$base]' heading; move the Unreleased entries under it before tagging" }
          # the release body: the "which file do I download" template, then this version's changelog entries
          $template = (Get-Content dev/release_notes.md -Raw).Replace('<ver>', $version)
          Set-Content -Path release-notes.md -Value ($template.TrimEnd() + "`n`n" + $m.Groups['body'].Value.Trim()) -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ns_dashboard/ui/package-lock.json

      - name: Build the dashboard UI and check the committed build
        shell: pwsh
        run: |
          Push-Location ns_dashboard/ui
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'npm run build failed' }
          Pop-Location
          # make_bundle.ps1 archives HEAD, so the committed ns_dashboard/static and installer/ui/static are what ships; it must equal this build.
          $changes = @(git status --porcelain ns_dashboard/static)
          if ($changes.Count -gt 0) { $changes; throw 'ns_dashboard/static differs from a fresh build of ns_dashboard/ui' }
          # the same build writes the installer's setup window to installer/ui/static (vite.installer.config.ts)
          $changes = @(git status --porcelain installer/ui/static)
          if ($changes.Count -gt 0) { $changes; throw 'installer/ui/static differs from a fresh build of ns_dashboard/ui' }

      - name: Fetch the WebView2 window files for the bundle
        shell: pwsh
        run: |
          # The frameless setup window needs three DLLs from the pinned nupkg. Shipping them inside the bundle
          # (bin/webview2/) lets the very first setup window use the host; s02 then skips the download.
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $pin = $manifest.bins.webview2
          $spec = Get-Content installer/webview2_files.json -Raw | ConvertFrom-Json
          if ($pin.sha256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'bins.webview2 is not pinned in manifest.json' }
          if ($spec.version -ne $pin.version) { throw "installer/webview2_files.json is for $($spec.version) but manifest.json pins $($pin.version)" }
          $nupkg = Join-Path $env:RUNNER_TEMP 'webview2.nupkg'
          Invoke-WebRequest -Uri $pin.url -OutFile $nupkg -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $nupkg -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $pin.sha256.ToLower()) { throw "webview2 nupkg sha256 $hash does not match the manifest pin $($pin.sha256)" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $out = Join-Path $env:RUNNER_TEMP 'webview2-bundle'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg)
          try {
            foreach ($prop in $spec.files.PSObject.Properties) {
              $entry = $zip.GetEntry($prop.Value.member)
              if ($null -eq $entry) { throw "the nupkg has no $($prop.Value.member)" }
              $dest = Join-Path $out $prop.Name
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
              $h = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLower()
              if ($h -ne $prop.Value.sha256.ToLower()) { throw "$($prop.Name) sha256 $h does not match installer/webview2_files.json" }
            }
          }
          finally { $zip.Dispose() }
          "WEBVIEW2_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build bundle
        shell: pwsh
        run: ./dev/make_bundle.ps1 -Version $env:TAG -WebView2Dir $env:WEBVIEW2_DIR

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $assets = @(
            "dist/Nightshift-Setup-$version.zip",
            "dist/Nightshift-Setup-$version.zip.sha256",
            "dist/Nightshift-Update-$version.zip",
            "dist/Nightshift-Update-$version.zip.sha256"
          )
          # A tag with a prerelease part (v0.1.15-rc1) is a release candidate: a GitHub prerelease, never "latest", so the
          # updater (it reads /releases/latest) never offers it (H-12). A plain vX.Y.Z is published as before.
          $candidate = $version.Contains('-')
          # build-qwentts.yml may have created the release already; create it only when absent.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $create = @('release', 'create', $env:TAG, '--title', "Nightshift $env:TAG", '--notes-file', 'release-notes.md', '--generate-notes')
            if ($candidate) { $create += @('--prerelease', '--latest=false') }
            gh @create
            if ($LASTEXITCODE -ne 0) {
              gh release view $env:TAG *> $null
              if ($LASTEXITCODE -ne 0) { throw 'could not create the release' }
            }
          }
          if ($candidate) {
            # whichever workflow made the release, it ends as a prerelease that is not latest (before any asset goes up)
            gh release edit $env:TAG --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'could not mark the release as a prerelease' }
          }
          gh release upload $env:TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'asset upload failed' }
