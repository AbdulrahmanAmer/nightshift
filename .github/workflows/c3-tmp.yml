name: c3-tmp
on:
  push:
    branches: [feat/c3-amendments]
jobs:
  schemas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      - run: python .github/c3_diff.py
