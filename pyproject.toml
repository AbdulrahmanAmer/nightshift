[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.1.15-rc6"
description = "Nightshift: local story-to-video studio for YouTube long-form + Shorts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27",
  "pyyaml>=6",
  "jinja2>=3.1",
  "rich>=13",
  "typer>=0.12",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Installed on the target machine only (spec §1.1). torch + TTS engines are installed by the
# installer from manifest.json pins, not from here, because the cu128 index cannot be locked here.
studio = [
  "Pillow>=10", "spacy>=3.7,<4", "imagehash>=4.3", "keyring>=25",
  # faster-whisper 1.2.x calls av.open(metadata_errors=...), which PyAV 19.0 removed: both caps are needed
  # (tests/test_install_caps.py). Raise them together, after checking faster_whisper/audio.py.
  "faster-whisper>=1.0,<1.3", "av>=11,<19",
  "opencv-python-headless>=4.9,<5",
  # Windows wheels: 4.6.3 added CUDA 12.8, 4.8.5 is built with CUDA 12.8 (cuBLAS 12.8.4.1). manifest.json
  # python.whisper_cuda pins the matching cuBLAS/cuDNN wheels: review it before raising the ceiling.
  "ctranslate2>=4.6.3,<4.9",
]
# `INSTALL.cmd --dev` (docs/DEV_MODE.md): the studio extra without the speech and GPU wheels (faster-whisper, PyAV,
# CTranslate2), because a dev install runs on fake engines and downloads no model. Keep it equal to `studio` minus
# those three (tests/test_dev_mode_extras.py checks it).
dev-install = [
  "Pillow>=10", "spacy>=3.7,<4", "imagehash>=4.3", "keyring>=25",
  "opencv-python-headless>=4.9,<5",
]
tts = ["fastapi>=0.115", "uvicorn>=0.30", "soundfile>=0.12"]
supervisor = ["fastapi>=0.115", "uvicorn>=0.30", "psutil>=6"]
# The dashboard runs in the supervisor venv (fastapi and uvicorn come from the supervisor extra): uploads, thumbnails, key storage.
dashboard = ["python-multipart>=0.0.9", "Pillow>=10", "keyring>=25"]
# httpx, numpy and pyyaml are base dependencies. The rest let CI import every component (fakes included).
dev = [
  "pytest>=8", "pytest-httpx>=0.32", "ruff>=0.6", "pyright>=1.1.380", "jsonschema>=4.23",
  "fastapi>=0.115", "psutil>=6", "python-multipart>=0.0.9", "opencv-python-headless>=4.9,<5",
  "Pillow>=10", "imagehash>=4.3", "uvicorn>=0.30",
]

[project.scripts]
ns = "ns_supervisor.cli:main"
studio = "ns_studio.cli:main"

[tool.setuptools.packages.find]
include = ["ns_common*", "ns_studio*", "ns_tts*", "ns_supervisor*", "ns_dashboard*", "installer*"]

[tool.setuptools.package-data]
ns_studio = ["prompts/*.md", "presets/*.yaml", "presets/formats/*.yaml", "presets/fonts/*", "exemplars/**/*"]
ns_dashboard = ["static/**/*", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "network: talks to the real internet (GitHub, Hugging Face); runs only when NS_NETWORK_TESTS is set",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Use ns_common.ffmpeg.run or the supervisor. subprocess is allowed only in ns_common/ffmpeg.py, ns_common/secret_file.py (icacls), ns_supervisor/, installer/, tools/, dev/ and tests/ (docs/ENGINEERING.md section 8)."

[tool.ruff.lint.per-file-ignores]
"ns_common/ffmpeg.py" = ["TID251"]
"ns_common/secret_file.py" = ["TID251"]  # icacls: the secrets file keeps its user-only ACL
"ns_supervisor/**" = ["TID251"]
"ns_tts/engine.py" = ["TID251"]
"ns_tts/sapi.py" = ["TID251"]
"ns_dashboard/updater.py" = ["TID251"]
"ns_studio/clipper/source.py" = ["TID251"]
"installer/**" = ["TID251"]
"tools/**" = ["TID251"]
"dev/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["ns_common", "ns_studio", "ns_tts", "ns_supervisor", "ns_dashboard", "tools", "proofs"]
