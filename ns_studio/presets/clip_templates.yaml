# Clipper template ids (spec 19.3) -> format presets (spec 17.1, CR-C8-8).
# Geometry, caption anchor and safe margins live in presets/formats/<format>.yaml; this file only maps the old
# template ids to those presets and adds what a preset does not describe: the layout kind the planner uses,
# what detection must find (`needs`), and the tracking constants of the single-face layouts.
gaming_facecam:
  format: clip_gaming_facecam
  layout: gaming
  description: Facecam on top at full width, gameplay (frame minus the facecam) below.
  needs: facecam
  when: A facecam rectangle was found.

podcast_stacked:
  format: clip_podcast_stacked
  layout: stacked
  description: Two face-centred speaker crops stacked, the active speaker gets a thin border.
  needs: faces_2
  when: Two or more stable faces.
  speaker_border_px: 2

podcast_single:
  format: clip_podcast_single
  layout: tracked
  description: One face-centred crop with smooth tracking, full height.
  needs: faces_1
  when: Two or more faces but the user picks a single speaker view.
  track_deadband: 0.2
  track_ramp_s: 1.0

talking_head:
  format: clip_talking_head
  layout: tracked
  description: Same tracked crop as podcast_single.
  needs: faces_1
  when: One stable face.
  track_deadband: 0.2
  track_ramp_s: 1.0

center_crop:
  format: clip_center_crop
  layout: center
  description: Centre 9:16 crop inside the safe area over a blurred, darkened full-frame fill.
  needs: none
  when: No faces, screen recordings, slides.

screen_plus_cam:
  format: clip_screen_plus_cam
  layout: screen_cam
  description: Facecam on top as in gaming_facecam, the whole source frame letterboxed below.
  needs: facecam
  when: User choice, for tutorials with a small camera.
