# Clip layout (spec 17.1, 19.3). Two face-centred speaker crops stacked, the speaking one gets a thin border.
id: clip_podcast_stacked
name: "Clip: podcast stacked"
kind: clip
canvas: {w: 1080, h: 1920}
duration: {min_s: 15, max_s: 90}
captions: {styles_allowed: [punch_yellow, clean_white, boxed_dark, minimal_lower], anchor_y_pct: 75}
layout:
  seam_captions: false
  regions:
    - {name: top, x: 0, y: 0, w: 1080, h: 960, source: "face:0"}
    - {name: bottom, x: 0, y: 960, w: 1080, h: 960, source: "face:1"}
safe_margins: {top: 220, bottom: 320}
shots: {min_s: 2, max_s: 6}
sheet: {hashtags_required: ["#Shorts"], description_rules: "Honest description with 'Clip from: <source title>'."}
