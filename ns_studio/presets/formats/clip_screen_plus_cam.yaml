# Clip layout (spec 17.1, 19.3). Facecam on top as in clip_gaming_facecam, the whole source frame letterboxed below.
id: clip_screen_plus_cam
name: "Clip: screen + camera"
kind: clip
canvas: {w: 1080, h: 1920, fps: 30}
duration: {min_s: 15, max_s: 90}
captions: {styles_allowed: [punch_yellow, clean_white, boxed_dark, minimal_lower], anchor_y_pct: 33, words_on_screen: 3}
layout:
  seam_captions: true
  regions:
    - {name: cam, x: 0, y: 0, w: 1080, h: 640, source: facecam}
    - {name: screen, x: 0, y: 640, w: 1080, h: 1280, source: screen}
safe_margins: {top: 220, bottom: 320}
shots: {min_s: 2, max_s: 6}
encoder: {preset: p4}
sheet: {hashtags_required: ["#Shorts"], description_rules: "Honest description with 'Clip from: <source title>'."}
