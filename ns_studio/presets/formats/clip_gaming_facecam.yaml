# Clip layout (spec 17.1, 19.3). Facecam on top (height from its aspect, at most 640 px), gameplay below, captions on the seam.
id: clip_gaming_facecam
name: "Clip: gaming + facecam"
kind: clip
canvas: {w: 1080, h: 1920}
duration: {min_s: 15, max_s: 90}
captions: {styles_allowed: [punch_yellow, clean_white, boxed_dark, minimal_lower], anchor_y_pct: 33}
layout:
  seam_captions: true
  regions:
    - {name: cam, x: 0, y: 0, w: 1080, h: 640, source: facecam}
    - {name: game, x: 0, y: 640, w: 1080, h: 1280, source: full}
safe_margins: {top: 220, bottom: 320}
shots: {min_s: 2, max_s: 6}
sheet: {hashtags_required: ["#Shorts"], description_rules: "Honest description with 'Clip from: <source title>'."}
