# Long-form master, 16:9 (spec 7, 18.5). 8:30-15:00, chapters with cards, shots of 5-9 s, clean captions.
id: long_16x9
name: Long-form 16:9
kind: long
canvas: {w: 1920, h: 1080, fps: 30}
duration: {min_s: 510, max_s: 900}
captions: {styles_allowed: [clean_white, minimal_lower], anchor_y_pct: 90, words_on_screen: 4}
layout:
  seam_captions: false
  regions:
    - {name: main, x: 0, y: 0, w: 1920, h: 1080, source: full}
safe_margins: {top: 54, bottom: 54}
shots: {min_s: 5, max_s: 9}
encoder: {preset: p4}
sheet:
  hashtags_required: []
  description_rules: "Chapter list with 00:00 first, at least 3 chapters of at least 10 s each; mid-roll only at chapter breaks."
