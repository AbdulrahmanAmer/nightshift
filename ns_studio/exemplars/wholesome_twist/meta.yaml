exemplars:
  - file: "lost_wallet.md"
    title: "The Hundred and Ninety"
    structure: "twist"
    pov_tone: "first_person_intimate"
    why: "The narrator opens by confessing a theft, and the stranger's gratitude years later recasts that guilt as the exact honesty the lost wallet was built to find."
  - file: "night_shift_baker.md"
    title: "Same as Always"
    structure: "reverse_reveal"
    pov_tone: "narrator_calm"
    why: "The story opens on the effect, an empty shelf, and peels back each wrong theory until the cause, an unspoken kindness handed down, arrives last and the baker inherits it."
  - file: "the_old_radio.md"
    title: "Nine O'Clock"
    structure: "unreliable_narrator"
    pov_tone: "second_person"
    why: "The confident 'you' keeps logging proof of a neighbor's bad intent, so the reader senses the misreading before the porch scene shows the radio was a gift to a grieving house."
