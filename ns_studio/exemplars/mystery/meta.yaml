exemplars:
  - file: "lighthouse_log.md"
    title: "The Missing Night"
    structure: "reverse_reveal"
    pov_tone: "narrator_calm"
    why: "The story opens on the finished clue (a cut page) and walks backward hour by hour, so each earlier scene recasts the object the listener already saw, and a crossed-seven detail planted early pays off in the last paragraph."
  - file: "last_ferry.md"
    title: "Six O'Clock"
    structure: "countdown"
    pov_tone: "narrator_urgent"
    why: "Time stamps drop in as the clock runs down while a buzzing piano note, heard once in passing, becomes the one fair clue that solves the theft just before the horn."
  - file: "library_card.md"
    title: "The Nicked Four"
    structure: "two_timelines"
    pov_tone: "first_person_intimate"
    why: "A single physical flaw, a chipped date stamp, links the narrator's 1978 self to this morning, so both timelines land on the same inked number and the final image completes the opening one."
