exemplars:
  - file: "doorbell.md"
    title: "The Guest Who Was Invited"
    structure: "twist"
    pov_tone: "first_person_intimate"
    why: "A mundane investigation with cameras flips on the final clue, revealing that the narrator himself is the one issuing the invitation."
  - file: "laundromat.md"
    title: "Dryer Nine"
    structure: "slow_burn"
    pov_tone: "narrator_calm"
    why: "A calm, orderly narrator logs small repeating oddities until a single folded object makes the dread personal."
  - file: "night_bus.md"
    title: "Last Stop"
    structure: "reverse_reveal"
    pov_tone: "second_person"
    why: "The frightening stranger turns out to be the protector, so the reader's fear is reversed at the moment the real threat appears."
