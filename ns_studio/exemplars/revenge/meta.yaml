exemplars:
  - file: "parking_spot.md"
    title: "Number Twelve"
    structure: "twist"
    pov_tone: "first_person_intimate"
    why: "The narrator wins by agreeing to everything the thief wanted, so the payback is a signed swap and the reader sees the trap only when nature springs it."
  - file: "group_project.md"
    title: "The Green Notebook"
    structure: "slow_burn"
    pov_tone: "narrator_calm"
    why: "Tiny, boring, repeated acts (weekly recap messages) quietly build the evidence, so the quiet reveal feels earned rather than vengeful."
  - file: "potluck.md"
    title: "Ten Minutes Before Noon"
    structure: "countdown"
    pov_tone: "narrator_urgent"
    why: "Each timed beat plants one visible prop whose meaning snaps into place at zero, turning the freeloader's own words into the reveal."
